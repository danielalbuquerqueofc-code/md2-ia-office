name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Ferramentas usadas pelos testes (FFmpeg, bubblewrap, socat)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg bubblewrap socat
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
